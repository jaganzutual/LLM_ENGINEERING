<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #fff;
            display: block;
        }
        #gameContainer {
            text-align: center;
        }
        #instructions {
            color: white;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="instructions">Press SPACE or Click to Flap</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game settings
        const SCREEN_WIDTH = 400;
        const SCREEN_HEIGHT = 600;
        const FPS = 60;
        const GRAVITY = 0.5;
        const FLAP_STRENGTH = -10;
        const PIPE_SPEED = 3;
        const PIPE_GAP = 150;
        const PIPE_FREQ = 1500; // milliseconds

        // Colors
        const BLUE = '#87CEEB';
        const GREEN = '#00C800';
        const BROWN = '#8B4513';
        const RED = '#FF0000';
        const WHITE = '#FFFFFF';

        // Bird class
        class Bird {
            constructor() {
                this.x = 50;
                this.y = SCREEN_HEIGHT / 2;
                this.width = 34;
                this.height = 24;
                this.velocity = 0;
            }

            flap() {
                this.velocity = FLAP_STRENGTH;
            }

            update() {
                this.velocity += GRAVITY;
                this.y += this.velocity;
            }

            draw() {
                ctx.fillStyle = RED;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.width, this.y + this.height / 2);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.closePath();
                ctx.fill();
            }

            getRect() {
                return {
                    x: this.x,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
            }
        }

        // Pipe class
        class Pipe {
            constructor(x) {
                this.x = x;
                this.width = 50;
                this.height = SCREEN_HEIGHT;
                this.gap_y = Math.floor(Math.random() * (SCREEN_HEIGHT - 200 - PIPE_GAP) + 100);
                this.passed = false;
            }

            update() {
                this.x -= PIPE_SPEED;
            }

            draw() {
                // Top pipe
                ctx.fillStyle = BROWN;
                ctx.fillRect(this.x, 0, this.width, this.gap_y);

                // Bottom pipe
                ctx.fillRect(this.x, this.gap_y + PIPE_GAP, this.width,
                           this.height - this.gap_y - PIPE_GAP);
            }

            offScreen() {
                return this.x + this.width < 0;
            }

            collidesWith(bird) {
                const birdRect = bird.getRect();

                // Check collision with top pipe
                if (this.rectCollision(birdRect, {
                    x: this.x,
                    y: 0,
                    width: this.width,
                    height: this.gap_y
                })) return true;

                // Check collision with bottom pipe
                if (this.rectCollision(birdRect, {
                    x: this.x,
                    y: this.gap_y + PIPE_GAP,
                    width: this.width,
                    height: this.height - this.gap_y - PIPE_GAP
                })) return true;

                return false;
            }

            rectCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }
        }

        // Game state
        let bird;
        let pipes = [];
        let score = 0;
        let running = true;
        let gameOver = false;
        let lastPipeTime = 0;

        // Initialize game
        function init() {
            bird = new Bird();
            pipes = [];
            score = 0;
            running = true;
            gameOver = false;
            lastPipeTime = Date.now();
        }

        // Handle input
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameOver) {
                    init();
                } else if (running) {
                    bird.flap();
                }
            }
        });

        canvas.addEventListener('click', () => {
            if (gameOver) {
                init();
            } else if (running) {
                bird.flap();
            }
        });

        // Game loop
        function gameLoop() {
            // Clear screen
            ctx.fillStyle = BLUE;
            ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

            if (running && !gameOver) {
                // Add pipes
                const currentTime = Date.now();
                if (currentTime - lastPipeTime > PIPE_FREQ) {
                    pipes.push(new Pipe(SCREEN_WIDTH));
                    lastPipeTime = currentTime;
                }

                // Update
                bird.update();
                pipes.forEach(pipe => pipe.update());

                // Collision detection
                if (bird.y + bird.height > SCREEN_HEIGHT || bird.y < 0) {
                    running = false;
                    gameOver = true;
                }

                for (let pipe of pipes) {
                    if (pipe.collidesWith(bird)) {
                        running = false;
                        gameOver = true;
                    }
                    if (!pipe.passed && pipe.x + pipe.width < bird.x) {
                        pipe.passed = true;
                        score++;
                    }
                }

                // Remove off-screen pipes
                pipes = pipes.filter(pipe => !pipe.offScreen());
            }

            // Draw
            pipes.forEach(pipe => pipe.draw());
            bird.draw();

            // Draw score
            ctx.fillStyle = WHITE;
            ctx.font = '36px Arial';
            ctx.fillText(`Score: ${score}`, 10, 40);

            // Game over screen
            if (gameOver) {
                ctx.fillStyle = WHITE;
                ctx.font = '48px Arial';
                ctx.fillText('Game Over', SCREEN_WIDTH / 2 - 120, SCREEN_HEIGHT / 2);
                ctx.font = '24px Arial';
                ctx.fillText('Press SPACE or Click to Restart', SCREEN_WIDTH / 2 - 160, SCREEN_HEIGHT / 2 + 40);
            }

            requestAnimationFrame(gameLoop);
        }

        // Start game
        init();
        gameLoop();
    </script>
</body>
</html>
